<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon OS - Sistema Operativo Estratégico</title>

  <!-- Configuración PWA / Web App -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Horizon OS" />
  <meta name="theme-color" content="#0b0f17" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .glass-card {
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Cargar datos guardados del almacenamiento local si existen
      const savedState = JSON.parse(localStorage.getItem('horizon_os_data') || '{}');

      // Estado de Onboarding y Formulario Secuencial
      const [onboardingComplete, setOnboardingComplete] = useState(savedState.onboardingComplete || false);
      const [currentStep, setCurrentStep] = useState(1);

      // Datos del Formulario
      const [formData, setFormData] = useState(savedState.formData || {
        stage: 'crear',
        niche: 'ropa',
        customNiche: '',
        timeCommitment: '2h',
        brandName: '',
        goalTarget: ''
      });

      // Plan Dinámico Generado y Progreso
      const [planDays, setPlanDays] = useState(savedState.planDays || []);
      const [currentDayIndex, setCurrentDayIndex] = useState(savedState.currentDayIndex || 0);
      const [unlockedDayIndex, setUnlockedDayIndex] = useState(savedState.unlockedDayIndex || 0);
      const [completedTasks, setCompletedTasks] = useState(savedState.completedTasks || {});

      // Vista de Calendario vs Lista
      const [viewMode, setViewMode] = useState('list');

      // Asesor Copiloto State
      const [aiQuery, setAiQuery] = useState('');
      const [aiResponse, setAiResponse] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      // Copiloto General Chat
      const [activeTab, setActiveTab] = useState('roadmap');
      const [generalMessages, setGeneralMessages] = useState(savedState.generalMessages || []);
      const [generalInput, setGeneralInput] = useState('');

      // GUARDADO AUTOMÁTICO CADA VEZ QUE CAMBIA CUALQUIER DATO
      useEffect(() => {
        const dataToSave = {
          onboardingComplete,
          formData,
          planDays,
          currentDayIndex,
          unlockedDayIndex,
          completedTasks,
          generalMessages
        };
        localStorage.setItem('horizon_os_data', JSON.stringify(dataToSave));
      }, [onboardingComplete, formData, planDays, currentDayIndex, unlockedDayIndex, completedTasks, generalMessages]);

      // Generación Ultra-Específica y Granular según Tiempo Diario
      const generateCustomStrategy = (data) => {
        const isCrear = data.stage === 'crear';
        const nicheText = data.niche === 'otro' ? data.customNiche || 'Negocio Personalizado' : data.niche;
        const is2h = data.timeCommitment === '2h';
        const is4h = data.timeCommitment === '4h';

        let baseAtomicTasks = [];

        if (isCrear) {
          if (data.niche === 'ropa') {
            baseAtomicTasks = [
              { title: "Definición del ADN y Moodboard de Marca", tasks: ["Crear panel de inspiración visual en Pinterest o Figma con referentes estéticos.", "Definir el concepto central y la propuesta de valor de la marca."] },
              { title: "Naming y Comprobación de Disponibilidad", tasks: ["Lluvia de ideas de 10 nombres acordes al concepto.", "Verificar disponibilidad de dominios web (.com/.es) y usuario en Instagram/TikTok."] },
              { title: "Identidad Gráfica - Logotipo e Isotipo", tasks: ["Bocetar o generar las primeras propuestas vectoriales del logotipo.", "Definir las variantes de logo (principal, versión reducida e isotipo)."] },
              { title: "Identidad Gráfica - Tipografías y Paleta de Color", tasks: ["Seleccionar la tipografía principal de marca y la secundaria para textos.", "Definir los códigos de color hex (principal, secundario y acento)."] },
              { title: "Ficha Técnica I - Patronaje y Medidas", tasks: ["Crear la tabla de medidas por talla (S, M, L, XL) para la primera prenda.", "Especificar el tipo de corte (ej. Oversize, Boxy Fit, Regular)."] },
              { title: "Ficha Técnica II - Tejidos y Gramajes", tasks: ["Seleccionar la composición del tejido (ej. 100% Algodón Peinado 280 GSM).", "Especificar tipo de estampación o bordado con sus dimensiones exactas."] },
              { title: "Prospección de Proveedores Textiles", tasks: ["Listar 5 talleres o fabricantes textiles locales/internacionales.", "Enviar correos de solicitud de cotización y catálogo de muestras a los proveedores."] },
              { title: "Solicitud y Evaluación de Muestras", tasks: ["Encargar las primeras muestras físicas de la prenda.", "Inspeccionar costuras, caída del tejido y calidad del acabado al recibir la muestra."] },
              { title: "Setup de Tienda Online (E-commerce)", tasks: ["Crear cuenta en Shopify y configurar el dominio propio.", "Subir el tema visual alineado con la paleta de colores y tipografía."] },
              { title: "Páginas Legales y Pasarelas de Pago", tasks: ["Configurar Stripe/PayPal y métodos de pago.", "Redactar e integrar políticas de envío, devoluciones y términos legales."] },
              { title: "Estrategia Teaser y Expectativa en Redes", tasks: ["Crear los perfiles oficiales en redes sociales.", "Publicar los primeros 3 contenidos tipo 'Behind The Scenes' del proceso de creación."] },
              { title: "Campamentos de Captación / Lista de Espera", tasks: ["Crear formulario en la tienda para captar emails a cambio de acceso anticipado.", "Lanzar campaña de expectativa para conseguir los primeros 100 inscritos."] }
            ];
          } else if (data.niche === 'app') {
            baseAtomicTasks = [
              { title: "Definición del Problema y Alcance del MVP", tasks: ["Redactar el problema exacto que resuelve la app en una frase.", "Listar las 3 funcionalidades indispensables sin las cuales la app no funciona."] },
              { title: "Wireframes en Papel / Figma", tasks: ["Dibujar el esquema de pantalla de registro e inicio de sesión.", "Dibujar el flujo principal donde el usuario obtiene el valor central."] },
              { title: "Diseño de Interfaz (UI/UX Básica)", tasks: ["Definir el kit de UI: botones, inputs y colores de estado.", "Diseñar la pantalla principal en Figma o v0."] },
              { title: "Landing Page de Lanzamiento", tasks: ["Redactar el titular principal y los beneficios clave.", "Publicar una landing con formulario para captar beta testers."] },
              { title: "Setup de Desarrollo & Base de Datos", tasks: ["Configurar el repositorio y la arquitectura básica de proyecto.", "Definir la estructura de la base de datos (usuarios, tablas principales)."] },
              { title: "Desarrollo del Flujo Principal (Día A)", tasks: ["Construir la pantalla de autenticación y perfil.", "Probar el registro y guardado de datos."] },
              { title: "Desarrollo del Flujo Principal (Día B)", tasks: ["Implementar la funcionalidad núcleo del software.", "Realizar pruebas de usabilidad en local."] },
              { title: "Beta Testing & Corrección de Bugs", tasks: ["Enviar acceso privado a los primeros 10 beta testers.", "Recopilar feedback directo y solucionar errores críticos."] }
            ];
          } else {
            baseAtomicTasks = [
              { title: `Análisis del Modelo (${nicheText})`, tasks: ["Definir la propuesta de valor única para este modelo específico.", "Establecer la estructura de costes y precios sugeridos."] },
              { title: "Avatar de Cliente Ideal", tasks: ["Identificar los 3 principales dolores del cliente objetivo.", "Definir los canales de comunicación donde se encuentra este cliente."] },
              { title: "Diseño de la Oferta Irresistible", tasks: ["Estructurar los entregables y la promesa de transformación.", "Redactar la garantía y los bonos de acción rápida."] },
              { title: "Construcción del Canal de Ventas", tasks: ["Diseñar la landing page o presentación comercial de la propuesta.", "Configurar el sistema de agendamiento o cobro directo."] },
              { title: "Estrategia de Captación Inicial", tasks: ["Definir la vía de prospección orgánica o pagada.", "Preparar las plantillas de contacto inicial adaptadas a " + nicheText + "."] },
              { title: "Lanzamiento y Primeras Conversaciones", tasks: ["Contactar a los primeros 20 prospectos cualificados.", "Ajustar la propuesta según las objeciones recibidas."] }
            ];
          }
        } else {
          baseAtomicTasks = [
            { title: "Auditoría de Métricas de Conversión", tasks: ["Revisar la tasa de conversión actual de la web/embudo.", "Identificar el punto de fuga con mayor pérdida de usuarios."] },
            { title: "Optimización de la Oferta y Pricing", tasks: ["Ajustar precios o paquetes de mayor ticket.", "Añadir elementos de urgencia y prueba social comprobada."] },
            { title: "Estrategia de Captación por DM / Outreach", tasks: ["Redactar el guion de prospección en 3 pasos por mensaje directo.", "Establecer objetivo diario de 15 conversaciones iniciadas."] },
            { title: "Estructura de Tráfico Pagado / Orgánico", tasks: ["Diseñar 3 creativos de anuncios orientados a conversión.", "Lanzar campaña de retargeting a usuarios que no completaron la compra."] },
            { title: "Sistema de Retención y Valor de Vida (LTV)", tasks: ["Implementar secuencia de email marketing post-compra.", "Crear incentivos para incentivar la recompra o recomendación."] }
          ];
        }

        let days = [];
        let dayCounter = 1;

        baseAtomicTasks.forEach((item) => {
          days.push({
            day: dayCounter++,
            title: item.title,
            tasks: item.tasks
          });
        });

        return days;
      };

      const handleNextStep = () => {
        if (currentStep < 4) {
          setCurrentStep(currentStep + 1);
        } else {
          const generatedPlan = generateCustomStrategy(formData);
          setPlanDays(generatedPlan);
          setOnboardingComplete(true);
        }
      };

      // Reiniciar proyecto / Empezar de nuevo
      const handleResetProject = () => {
        if (confirm("¿Seguro que quieres reiniciar el proyecto? Se borrará el progreso actual.")) {
          localStorage.removeItem('horizon_os_data');
          setOnboardingComplete(false);
          setCurrentStep(1);
          setPlanDays([]);
          setCurrentDayIndex(0);
          setUnlockedDayIndex(0);
          setCompletedTasks({});
          setGeneralMessages([]);
        }
      };

      // Control de completado de tareas y días
      const handleTaskToggle = (dayIdx, taskIdx) => {
        const key = `${dayIdx}-${taskIdx}`;
        setCompletedTasks(prev => ({
          ...prev,
          [key]: !prev[key]
        }));
      };

      const isDayTasksComplete = (dayIdx) => {
        const day = planDays[dayIdx];
        if (!day) return false;
        return day.tasks.every((_, tIdx) => completedTasks[`${dayIdx}-${tIdx}`]);
      };

      const handleCompleteDayAndAdvance = () => {
        if (currentDayIndex < planDays.length - 1) {
          const nextIdx = currentDayIndex + 1;
          setUnlockedDayIndex(Math.max(unlockedDayIndex, nextIdx));
          setCurrentDayIndex(nextIdx);
          setAiResponse('');
          setAiQuery('');
        }
      };

      // Consultar al Copiloto Integrado por Tarea
      const handleAskTaskCopilot = async (taskContext) => {
        if (!aiQuery.trim()) return;
        setAiLoading(true);
        setAiResponse('');

        const nicheName = formData.niche === 'otro' ? formData.customNiche : formData.niche;

        const prompt = `Contexto del cliente:
- Fase: ${formData.stage === 'crear' ? 'Crear proyecto nuevo' : 'Escalar negocio existente'}
- Nicho / Modelo: ${nicheName}
- Tiempo diario disponible: ${formData.timeCommitment}
- Marca/Proyecto: ${formData.brandName || 'Horizon Project'}
- Objetivo: ${formData.goalTarget || 'Crecer y facturar'}

Día/Tarea actual: "${taskContext}"
Pregunta concreta del usuario: "${aiQuery}"

Instrucción: Da una respuesta sumamente táctica, directa y ejecutable en 3-4 viñetas accionables adaptadas a sus ${formData.timeCommitment} diarios.`;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          setAiResponse(data.text || 'Sin respuesta.');
        } catch (err) {
          setAiResponse('Error al comunicarse con el copiloto.');
        } finally {
          setAiLoading(false);
        }
      };

      // Chat General del Copiloto
      const handleSendGeneralMessage = async () => {
        if (!generalInput.trim()) return;
        const userMsg = generalInput;
        setGeneralMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setGeneralInput('');

        const nicheName = formData.niche === 'otro' ? formData.customNiche : formData.niche;

        const prompt = `Actúa como el Asistente Director Ejecutivo de Horizon OS para el usuario.
Contexto:
- Modelo de Negocio: ${nicheName}
- Fase: ${formData.stage}
- Disponibilidad: ${formData.timeCommitment} al día.
- Objetivo: ${formData.goalTarget}

Pregunta: ${userMsg}`;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          setGeneralMessages(prev => [...prev, { role: 'assistant', text: data.text }]);
        } catch (err) {
          setGeneralMessages(prev => [...prev, { role: 'assistant', text: 'Error de comunicación con la IA.' }]);
        }
      };

      const progressPercentage = planDays.length > 0 
        ? Math.round((unlockedDayIndex / planDays.length) * 100)
        : 0;

      return (
        <div class="flex-1 flex flex-col max-w-6xl w-full mx-auto p-4 md:p-6">
          {/* Header Superior */}
          <header class="flex items-center justify-between pb-6 mb-6 border-b border-slate-800">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-xl">
                H
              </div>
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white">HORIZON OS</h1>
                <p class="text-xs text-slate-400">Sistema Operativo Estratégico & Ejecución Táctica</p>
              </div>
            </div>

            {onboardingComplete && (
              <div class="flex items-center space-x-3">
                <button
                  onClick={handleResetProject}
                  class="text-xs text-slate-500 hover:text-red-400 transition"
                  title="Reiniciar Proyecto"
                >
                  ⚙️ Reiniciar
                </button>
                <div class="flex items-center space-x-2 bg-slate-900 border border-slate-800 p-1.5 rounded-xl text-xs">
                  <button
                    onClick={() => setActiveTab('roadmap')}
                    class={`px-3 py-1.5 rounded-lg font-medium transition ${activeTab === 'roadmap' ? 'bg-emerald-500 text-slate-950 shadow-sm' : 'text-slate-400 hover:text-white'}`}
                  >
                    Hoja de Ruta ({planDays.length} Días)
                  </button>
                  <button
                    onClick={() => setActiveTab('copilot')}
                    class={`px-3 py-1.5 rounded-lg font-medium transition ${activeTab === 'copilot' ? 'bg-emerald-500 text-slate-950 shadow-sm' : 'text-slate-400 hover:text-white'}`}
                  >
                    Copiloto General
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* BARRA DE PROGRESO HORIZONTAL PROPORCIONAL */}
          {onboardingComplete && activeTab === 'roadmap' && (
            <div class="mb-6 glass-card p-4 rounded-2xl">
              <div class="flex items-center justify-between text-xs font-semibold mb-2">
                <span class="text-slate-300">PROGRESO DE LA ESTRATEGIA</span>
                <span class="text-emerald-400">{unlockedDayIndex} de {planDays.length} Días Completados ({progressPercentage}%)</span>
              </div>
              <div class="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                <div 
                  class="h-full bg-emerald-500 transition-all duration-500 ease-out shadow-lg shadow-emerald-500/50"
                  style={{ width: `${progressPercentage}%` }}
                ></div>
              </div>
            </div>
          )}

          {/* FLUSO 1: CUESTIONARIO ONBOARDING SECUENCIAL */}
          {!onboardingComplete && (
            <main class="flex-1 flex items-center justify-center">
              <div class="glass-card p-8 rounded-2xl max-w-xl w-full shadow-2xl relative overflow-hidden">
                {/* Indicador de Progresión */}
                <div class="flex items-center justify-between mb-8">
                  {[1, 2, 3, 4].map(stepNum => (
                    <div key={stepNum} class="flex items-center">
                      <div class={`w-9 h-9 rounded-full flex items-center justify-center font-semibold text-sm transition ${
                        currentStep === stepNum
                          ? 'bg-emerald-500 text-slate-950 ring-4 ring-emerald-500/20'
                          : currentStep > stepNum
                          ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/40'
                          : 'bg-slate-800 text-slate-500'
                      }`}>
                        {stepNum}
                      </div>
                      {stepNum < 4 && (
                        <div class={`w-12 h-1 mx-2 rounded ${currentStep > stepNum ? 'bg-emerald-500/50' : 'bg-slate-800'}`}></div>
                      )}
                    </div>
                  ))}
                </div>

                {/* PASO 1: FASE DEL PROYECTO */}
                {currentStep === 1 && (
                  <div class="space-y-5">
                    <h2 class="text-2xl font-bold text-white">¿En qué punto te encuentras?</h2>
                    <p class="text-sm text-slate-400">Selecciona el estado actual de tu iniciativa para calibrar los cimientos.</p>
                    
                    <div class="grid grid-cols-1 gap-4 pt-2">
                      <button
                        onClick={() => setFormData({ ...formData, stage: 'crear' })}
                        class={`p-5 rounded-xl border text-left transition flex items-start justify-between ${
                          formData.stage === 'crear'
                            ? 'bg-emerald-500/10 border-emerald-500 text-white'
                            : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div>
                          <div class="font-bold text-lg mb-1">🚀 Crear un Proyecto Nuevo</div>
                          <div class="text-xs text-slate-400">Empezar desde cero: definir nombre, identidad visual, MVP o lanzamiento.</div>
                        </div>
                      </button>

                      <button
                        onClick={() => setFormData({ ...formData, stage: 'escalar' })}
                        class={`p-5 rounded-xl border text-left transition flex items-start justify-between ${
                          formData.stage === 'escalar'
                            ? 'bg-emerald-500/10 border-emerald-500 text-white'
                            : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div>
                          <div class="font-bold text-lg mb-1">📈 Escalar Negocio Existente</div>
                          <div class="text-xs text-slate-400">Optimizar embudos, aumentar facturación, prospección directa y tráfico.</div>
                        </div>
                      </button>
                    </div>
                  </div>
                )}

                {/* PASO 2: TIPO DE NICHO / MODELO DE NEGOCIO */}
                {currentStep === 2 && (
                  <div class="space-y-5">
                    <h2 class="text-2xl font-bold text-white">¿Cuál es tu modelo / nicho?</h2>
                    <p class="text-sm text-slate-400">Cada tipo de negocio requiere hitos tácticos completamente diferentes.</p>
                    
                    <div class="grid grid-cols-2 gap-3 pt-2">
                      {[
                        { id: 'ropa', label: '👕 Marca de Ropa / Moda', desc: 'Tech packs, muestras, drops' },
                        { id: 'app', label: '📱 Aplicación / SaaS', desc: 'Wireframes, MVP, beta testers' },
                        { id: 'servicios', label: '🤝 Servicios / Agencia', desc: 'High ticket, llamadas de venta' },
                        { id: 'ecommerce', label: '🛍️ E-commerce General', desc: 'Catálogo, ROAS, conversión' },
                        { id: 'otro', label: '✨ Otro (Personalizado)', desc: 'Escribe tu modelo exacto' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setFormData({ ...formData, niche: item.id })}
                          class={`p-4 rounded-xl border text-left transition ${
                            formData.niche === item.id
                              ? 'bg-emerald-500/10 border-emerald-500 text-white'
                              : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div class="font-bold text-sm mb-1">{item.label}</div>
                          <div class="text-xs text-slate-400">{item.desc}</div>
                        </button>
                      ))}
                    </div>

                    {formData.niche === 'otro' && (
                      <div class="pt-2">
                        <label class="block text-xs font-semibold text-emerald-400 mb-1.5 uppercase tracking-wider">Escribe tu modelo de negocio exacto:</label>
                        <input
                          type="text"
                          placeholder="Ej: Taller artesanal de joyas, Membresía de fitness, etc."
                          value={formData.customNiche}
                          onChange={(e) => setFormData({ ...formData, customNiche: e.target.value })}
                          class="w-full bg-slate-900 border border-emerald-500/50 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    )}
                  </div>
                )}

                {/* PASO 3: TIEMPO DIARIO */}
                {currentStep === 3 && (
                  <div class="space-y-5">
                    <h2 class="text-2xl font-bold text-white">¿Cuánto tiempo puedes dedicarle al día?</h2>
                    <p class="text-sm text-slate-400">Ajustaremos la carga de trabajo por jornada para garantizar ejecución sin bloqueo.</p>

                    <div class="grid grid-cols-1 gap-3 pt-2">
                      {[
                        { id: '2h', title: '⏱️ 1 a 2 Horas / día', desc: 'Tareas atómicas ultra-específicas (Estrategia distribuida en más días reales).' },
                        { id: '4h', title: '⚡ 3 a 4 Horas / día', desc: 'Ritmo acelerado de ejecución diaria.' },
                        { id: '8h', title: '🔥 Tiempo Completo (5-8h / día)', desc: 'Máxima intensidad y avance condensado.' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setFormData({ ...formData, timeCommitment: item.id })}
                          class={`p-4 rounded-xl border text-left transition ${
                            formData.timeCommitment === item.id
                              ? 'bg-emerald-500/10 border-emerald-500 text-white'
                              : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div class="font-bold text-base mb-1">{item.title}</div>
                          <div class="text-xs text-slate-400">{item.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* PASO 4: NOMBRE Y OBJETIVO */}
                {currentStep === 4 && (
                  <div class="space-y-5">
                    <h2 class="text-2xl font-bold text-white">Detalles Finales & Meta</h2>
                    <p class="text-sm text-slate-400">Ponle nombre a la iniciativa y define la meta concreta.</p>

                    <div class="space-y-4 pt-2">
                      <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Nombre de la Marca o Proyecto</label>
                        <input
                          type="text"
                          placeholder="Ej. Timeless, Horizon App, GLA..."
                          value={formData.brandName}
                          onChange={(e) => setFormData({ ...formData, brandName: e.target.value })}
                          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                        />
                      </div>

                      <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
                          {formData.stage === 'escalar' ? 'Objetivo de Facturación Mensual' : 'Meta Principal de Lanzamiento'}
                        </label>
                        <input
                          type="text"
                          placeholder={formData.stage === 'escalar' ? 'Ej. Pasar de 5.000€ a 10.000€/mes' : 'Ej. Facturar 10.000€/mes o lanzar colección'}
                          value={formData.goalTarget}
                          onChange={(e) => setFormData({ ...formData, goalTarget: e.target.value })}
                          class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {/* Botón de Siguiente / Generar */}
                <div class="mt-8 pt-4 border-t border-slate-800 flex justify-between items-center">
                  {currentStep > 1 ? (
                    <button
                      onClick={() => setCurrentStep(currentStep - 1)}
                      class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition"
                    >
                      Atrás
                    </button>
                  ) : <div></div>}

                  <button
                    onClick={handleNextStep}
                    class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm"
                  >
                    {currentStep === 4 ? 'Generar Mi Estrategia Personalizada' : 'Siguiente Paso →'}
                  </button>
                </div>
              </div>
            </main>
          )}

          {/* FLUJO 2: DASHBOARD CON CALENDARIO Y COPILOTO */}
          {onboardingComplete && activeTab === 'roadmap' && (
            <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Menú Izquierdo: Lista o Grid de Días con Candados */}
              <div class="lg:col-span-4 space-y-3">
                <div class="glass-card p-4 rounded-2xl mb-4 flex items-center justify-between">
                  <div>
                    <div class="text-xs text-emerald-400 font-semibold uppercase tracking-wider mb-1">Estrategia Activa</div>
                    <div class="text-lg font-bold text-white">{formData.brandName || 'Horizon Project'}</div>
                    <div class="text-xs text-slate-400 mt-1 flex items-center space-x-2">
                      <span class="bg-slate-800 px-2 py-0.5 rounded text-slate-300 uppercase">
                        {formData.niche === 'otro' ? formData.customNiche : formData.niche}
                      </span>
                      <span class="bg-slate-800 px-2 py-0.5 rounded text-slate-300">{formData.timeCommitment}/día</span>
                    </div>
                  </div>

                  <div class="flex items-center space-x-1 bg-slate-900 border border-slate-800 p-1 rounded-lg">
                    <button
                      onClick={() => setViewMode('list')}
                      class={`px-2 py-1 rounded text-xs font-medium transition ${viewMode === 'list' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                      title="Vista Lista"
                    >
                      Lista
                    </button>
                    <button
                      onClick={() => setViewMode('grid')}
                      class={`px-2 py-1 rounded text-xs font-medium transition ${viewMode === 'grid' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                      title="Vista Calendario"
                    >
                      Grid
                    </button>
                  </div>
                </div>

                {/* VISTA LISTA VERTICAL */}
                {viewMode === 'list' && (
                  <div class="space-y-2 max-h-[520px] overflow-y-auto pr-1">
                    {planDays.map((dayData, idx) => {
                      const isLocked = idx > unlockedDayIndex;
                      const isCurrent = idx === currentDayIndex;

                      return (
                        <button
                          key={dayData.day}
                          disabled={isLocked}
                          onClick={() => {
                            if (!isLocked) {
                              setCurrentDayIndex(idx);
                              setAiResponse('');
                              setAiQuery('');
                            }
                          }}
                          class={`w-full p-4 rounded-xl border text-left transition flex items-center justify-between relative overflow-hidden ${
                            isCurrent
                              ? 'bg-emerald-500/10 border-emerald-500 text-white'
                              : isLocked
                              ? 'bg-slate-900/20 border-slate-800/40 text-slate-600 opacity-50 blur-[0.6px] cursor-not-allowed'
                              : 'bg-slate-900/40 border-slate-800/80 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div>
                            <div class="text-xs text-emerald-400 font-bold uppercase mb-0.5 flex items-center space-x-1">
                              <span>Día {dayData.day}</span>
                              {isLocked && <span>🔒</span>}
                            </div>
                            <div class="font-medium text-sm text-slate-200">{dayData.title}</div>
                          </div>
                          <div class="text-xs text-slate-500">{dayData.tasks.length} tareas</div>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* VISTA GRID CALENDARIO */}
                {viewMode === 'grid' && (
                  <div class="grid grid-cols-3 gap-2 max-h-[520px] overflow-y-auto pr-1">
                    {planDays.map((dayData, idx) => {
                      const isLocked = idx > unlockedDayIndex;
                      const isCurrent = idx === currentDayIndex;

                      return (
                        <button
                          key={dayData.day}
                          disabled={isLocked}
                          onClick={() => {
                            if (!isLocked) {
                              setCurrentDayIndex(idx);
                              setAiResponse('');
                              setAiQuery('');
                            }
                          }}
                          class={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center space-y-1 ${
                            isCurrent
                              ? 'bg-emerald-500/20 border-emerald-500 text-white font-bold'
                              : isLocked
                              ? 'bg-slate-900/20 border-slate-800/30 text-slate-600 opacity-40 blur-[0.5px] cursor-not-allowed'
                              : 'bg-slate-900/50 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <span class="text-xs font-bold text-emerald-400 uppercase">Día {dayData.day}</span>
                          {isLocked ? (
                            <span class="text-lg">🔒</span>
                          ) : (
                            <span class="text-xs line-clamp-1 text-slate-400">{dayData.title}</span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Panel Central: Tareas del Día Activo */}
              <div class="lg:col-span-8">
                {planDays[currentDayIndex] && (
                  <div class="glass-card p-6 rounded-2xl space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                      <div>
                        <span class="text-xs font-bold uppercase text-emerald-400 tracking-wider">
                          Paso Diario #{planDays[currentDayIndex].day}
                        </span>
                        <h2 class="text-2xl font-bold text-white mt-1">
                          {planDays[currentDayIndex].title}
                        </h2>
                      </div>

                      {currentDayIndex < planDays.length - 1 && (
                        <button
                          onClick={handleCompleteDayAndAdvance}
                          disabled={!isDayTasksComplete(currentDayIndex)}
                          class={`px-4 py-2.5 rounded-xl text-xs font-bold transition ${
                            isDayTasksComplete(currentDayIndex)
                              ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-500/20'
                              : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700/50'
                          }`}
                        >
                          {isDayTasksComplete(currentDayIndex) ? 'Completar día y avanzar →' : '🔒 Completa las tareas para avanzar'}
                        </button>
                      )}
                    </div>

                    {/* Lista de Tareas con Checkbox */}
                    <div class="space-y-4">
                      {planDays[currentDayIndex].tasks.map((taskDesc, taskIdx) => {
                        const isChecked = !!completedTasks[`${currentDayIndex}-${taskIdx}`];

                        return (
                          <div 
                            key={taskIdx} 
                            onClick={() => handleTaskToggle(currentDayIndex, taskIdx)}
                            class={`border p-4 rounded-xl space-y-2 cursor-pointer transition ${
                              isChecked
                                ? 'bg-emerald-950/20 border-emerald-500/50'
                                : 'bg-slate-900/70 border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            <div class="flex items-start space-x-3">
                              <input 
                                type="checkbox" 
                                checked={isChecked}
                                onChange={() => {}} 
                                class="mt-1 accent-emerald-500 w-4 h-4 rounded cursor-pointer" 
                              />
                              <div>
                                <h3 class={`font-bold text-sm ${isChecked ? 'text-emerald-400 line-through' : 'text-slate-200'}`}>
                                  {taskDesc}
                                </h3>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Asesor Copiloto Integrado para esta tarea */}
                    <div class="pt-4 border-t border-slate-800/80">
                      <div class="flex items-center space-x-2 text-xs font-bold uppercase text-emerald-400 tracking-wider mb-2">
                        <span>🤖 Asesor Táctico Copiloto:</span>
                      </div>
                      
                      <div class="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="Ej: ¿Cómo redacto exactamente este mensaje o qué herramienta uso?"
                          value={aiQuery}
                          onChange={(e) => setAiQuery(e.target.value)}
                          class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                        />
                        <button
                          onClick={() => handleAskTaskCopilot(planDays[currentDayIndex].title)}
                          disabled={aiLoading}
                          class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition disabled:opacity-50"
                        >
                          {aiLoading ? 'Analizando...' : 'Consultar'}
                        </button>
                      </div>

                      {aiResponse && (
                        <div class="mt-3 p-4 bg-emerald-950/20 border border-emerald-500/30 rounded-xl text-xs text-slate-200 leading-relaxed space-y-2 whitespace-pre-line">
                          {aiResponse}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* PESTAÑA: COPILOTO GENERAL */}
          {onboardingComplete && activeTab === 'copilot' && (
            <main class="flex-1 flex flex-col glass-card rounded-2xl overflow-hidden h-[600px]">
              <div class="p-4 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between">
                <div>
                  <h3 class="font-bold text-white text-sm">Copiloto Estratégico Ejecutivo</h3>
                  <p class="text-xs text-slate-400">Consulta decisiones de negocio, copywriting o resolución de cuellos de botella.</p>
                </div>
              </div>

              <div class="flex-1 p-4 overflow-y-auto space-y-3">
                {generalMessages.length === 0 && (
                  <div class="text-center text-slate-500 text-xs my-12">
                    Escribe tu primera consulta táctica para tu proyecto ({formData.brandName}).
                  </div>
                )}
                {generalMessages.map((msg, i) => (
                  <div key={i} class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div class={`max-w-xl p-3.5 rounded-xl text-xs leading-relaxed whitespace-pre-line ${
                      msg.role === 'user'
                        ? 'bg-emerald-500 text-slate-950 font-medium'
                        : 'bg-slate-900 border border-slate-800 text-slate-200'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
              </div>

              <div class="p-3 bg-slate-900/90 border-t border-slate-800 flex items-center space-x-2">
                <input
                  type="text"
                  placeholder="Pregunta lo que quieras sobre tu estrategia..."
                  value={generalInput}
                  onChange={(e) => setGeneralInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSendGeneralMessage()}
                  class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                />
                <button
                  onClick={handleSendGeneralMessage}
                  class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition"
                >
                  Enviar
                </button>
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
