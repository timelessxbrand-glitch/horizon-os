<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Horizon OS — Apple Design Edition</title>

  <!-- PWA & Apple Web App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Horizon OS" />
  <meta name="theme-color" content="#000000" />

  <!-- CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      font-family: var(--font-apple);
      color: #F5F5F7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.02em;
      overflow-x: hidden;
    }

    /* Apple Liquid Ambient Background */
    .apple-ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 20%, rgba(0, 122, 255, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(175, 82, 222, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(52, 199, 89, 0.08) 0%, transparent 50%);
      filter: blur(60px);
    }

    /* Apple Liquid Glass Panels */
    .apple-glass-panel {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -1px 1px rgba(0, 0, 0, 0.2);
    }

    .apple-glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-glass-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Apple Input Glass */
    .apple-glass-input {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-glass-input:focus {
      border-color: #007AFF;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.25);
      background: rgba(0, 0, 0, 0.6);
    }

    /* Apple Primary Action Button */
    .apple-btn-primary {
      background: linear-gradient(180deg, #007AFF 0%, #0062CC 100%);
      box-shadow: 
        0 4px 16px rgba(0, 122, 255, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apple-btn-primary:active {
      transform: scale(0.97);
      filter: brightness(0.9);
    }

    /* Smooth Apple Transitions */
    .apple-transition {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom Scrollbar iOS Style */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-blue-500/30 selection:text-white">
  <!-- Fondo con orbes de luz dinámica estilo Apple -->
  <div class="apple-ambient-bg"></div>

  <div id="root" class="relative z-10 flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Cargar datos persistentes
      const savedState = JSON.parse(localStorage.getItem('horizon_os_data') || '{}');

      // Onboarding & Form Status
      const [onboardingComplete, setOnboardingComplete] = useState(savedState.onboardingComplete || false);
      const [currentStep, setCurrentStep] = useState(1);

      // Form Data
      const [formData, setFormData] = useState(savedState.formData || {
        stage: 'crear',
        niche: 'ropa',
        customNiche: '',
        timeCommitment: '2h',
        brandName: '',
        goalTarget: ''
      });

      // Plan Dinámico y Progreso
      const [planDays, setPlanDays] = useState(savedState.planDays || []);
      const [currentDayIndex, setCurrentDayIndex] = useState(savedState.currentDayIndex || 0);
      const [unlockedDayIndex, setUnlockedDayIndex] = useState(savedState.unlockedDayIndex || 0);
      const [completedTasks, setCompletedTasks] = useState(savedState.completedTasks || {});

      // Vistas
      const [viewMode, setViewMode] = useState('list');
      const [activeTab, setActiveTab] = useState('roadmap');

      // Asesor Copiloto
      const [aiQuery, setAiQuery] = useState('');
      const [aiResponse, setAiResponse] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      // Chat General Copiloto
      const [generalMessages, setGeneralMessages] = useState(savedState.generalMessages || []);
      const [generalInput, setGeneralInput] = useState('');

      // Guardado Automático
      useEffect(() => {
        const dataToSave = {
          onboardingComplete,
          formData,
          planDays,
          currentDayIndex,
          unlockedDayIndex,
          completedTasks,
          generalMessages
        };
        localStorage.setItem('horizon_os_data', JSON.stringify(dataToSave));
      }, [onboardingComplete, formData, planDays, currentDayIndex, unlockedDayIndex, completedTasks, generalMessages]);

      const generateCustomStrategy = (data) => {
        const isCrear = data.stage === 'crear';
        const nicheText = data.niche === 'otro' ? data.customNiche || 'Negocio Personalizado' : data.niche;

        let baseAtomicTasks = [];

        if (isCrear) {
          if (data.niche === 'ropa') {
            baseAtomicTasks = [
              { title: "Definición del ADN y Moodboard de Marca", tasks: ["Crear panel de inspiración visual en Pinterest o Figma con referentes estéticos.", "Definir el concepto central y la propuesta de valor de la marca."] },
              { title: "Naming y Comprobación de Disponibilidad", tasks: ["Lluvia de ideas de 10 nombres acordes al concepto.", "Verificar disponibilidad de dominios web (.com/.es) y usuario en Instagram/TikTok."] },
              { title: "Identidad Gráfica - Logotipo e Isotipo", tasks: ["Bocetar o generar las primeras propuestas vectoriales del logotipo.", "Definir las variantes de logo (principal, versión reducida e isotipo)."] },
              { title: "Identidad Gráfica - Tipografías y Paleta de Color", tasks: ["Seleccionar la tipografía principal de marca y la secundaria para textos.", "Definir los códigos de color hex (principal, secundario y acento)."] },
              { title: "Ficha Técnica I - Patronaje y Medidas", tasks: ["Crear la tabla de medidas por talla (S, M, L, XL) para la primera prenda.", "Especificar el tipo de corte (ej. Oversize, Boxy Fit, Regular)."] },
              { title: "Ficha Técnica II - Tejidos y Gramajes", tasks: ["Seleccionar la composición del tejido (ej. 100% Algodón Peinado 280 GSM).", "Especificar tipo de estampación o bordado con sus dimensiones exactas."] },
              { title: "Prospección de Proveedores Textiles", tasks: ["Listar 5 talleres o fabricantes textiles locales/internacionales.", "Enviar correos de solicitud de cotización y catálogo de muestras a los proveedores."] },
              { title: "Solicitud y Evaluación de Muestras", tasks: ["Encargar las primeras muestras físicas de la prenda.", "Inspeccionar costuras, caída del tejido y calidad del acabado al recibir la muestra."] },
              { title: "Setup de Tienda Online (E-commerce)", tasks: ["Crear cuenta en Shopify y configurar el dominio propio.", "Subir el tema visual alineado con la paleta de colores y tipografía."] },
              { title: "Páginas Legales y Pasarelas de Pago", tasks: ["Configurar Stripe/PayPal y métodos de pago.", "Redactar e integrar políticas de envío, devoluciones y términos legales."] },
              { title: "Estrategia Teaser y Expectativa en Redes", tasks: ["Crear los perfiles oficiales en redes sociales.", "Publicar los primeros 3 contenidos tipo 'Behind The Scenes' del proceso de creación."] },
              { title: "Campamentos de Captación / Lista de Espera", tasks: ["Crear formulario en la tienda para captar emails a cambio de acceso anticipado.", "Lanzar campaña de expectativa para conseguir los primeros 100 inscritos."] }
            ];
          } else if (data.niche === 'app') {
            baseAtomicTasks = [
              { title: "Definición del Problema y Alcance del MVP", tasks: ["Redactar el problema exacto que resuelve la app en una frase.", "Listar las 3 funcionalidades indispensables sin las cuales la app no funciona."] },
              { title: "Wireframes en Papel / Figma", tasks: ["Dibujar el esquema de pantalla de registro e inicio de sesión.", "Dibujar el flujo principal donde el usuario obtiene el valor central."] },
              { title: "Diseño de Interfaz (UI/UX Básica)", tasks: ["Definir el kit de UI: botones, inputs y colores de estado.", "Diseñar la pantalla principal en Figma o v0."] },
              { title: "Landing Page de Lanzamiento", tasks: ["Redactar el titular principal y los beneficios clave.", "Publicar una landing con formulario para captar beta testers."] },
              { title: "Setup de Desarrollo & Base de Datos", tasks: ["Configurar el repositorio y la arquitectura básica de proyecto.", "Definir la estructura de la base de datos (usuarios, tablas principales)."] },
              { title: "Desarrollo del Flujo Principal (Día A)", tasks: ["Construir la pantalla de autenticación y perfil.", "Probar el registro y guardado de datos."] },
              { title: "Desarrollo del Flujo Principal (Día B)", tasks: ["Implementar la funcionalidad núcleo del software.", "Realizar pruebas de usabilidad en local."] },
              { title: "Beta Testing & Corrección de Bugs", tasks: ["Enviar acceso privado a los primeros 10 beta testers.", "Recopilar feedback directo y solucionar errores críticos."] }
            ];
          } else {
            baseAtomicTasks = [
              { title: `Análisis del Modelo (${nicheText})`, tasks: ["Definir la propuesta de valor única para este modelo específico.", "Establecer la estructura de costes y precios sugeridos."] },
              { title: "Avatar de Cliente Ideal", tasks: ["Identificar los 3 principales dolores del cliente objetivo.", "Definir los canales de comunicación donde se encuentra este cliente."] },
              { title: "Diseño de la Oferta Irresistible", tasks: ["Estructurar los entregables y la promesa de transformación.", "Redactar la garantía y los bonos de acción rápida."] },
              { title: "Construcción del Canal de Ventas", tasks: ["Diseñar la landing page o presentación comercial de la propuesta.", "Configurar el sistema de agendamiento o cobro directo."] },
              { title: "Estrategia de Captación Inicial", tasks: ["Definir la vía de prospección orgánica o pagada.", "Preparar las plantillas de contacto inicial adaptadas a " + nicheText + "."] },
              { title: "Lanzamiento y Primeras Conversaciones", tasks: ["Contactar a los primeros 20 prospectos cualificados.", "Ajustar la propuesta según las objeciones recibidas."] }
            ];
          }
        } else {
          baseAtomicTasks = [
            { title: "Auditoría de Métricas de Conversión", tasks: ["Revisar la tasa de conversión actual de la web/embudo.", "Identificar el punto de fuga con mayor pérdida de usuarios."] },
            { title: "Optimización de la Oferta y Pricing", tasks: ["Ajustar precios o paquetes de mayor ticket.", "Añadir elementos de urgencia y prueba social comprobada."] },
            { title: "Estrategia de Captación por DM / Outreach", tasks: ["Redactar el guion de prospección en 3 pasos por mensaje directo.", "Establecer objetivo diario de 15 conversaciones iniciadas."] },
            { title: "Estructura de Tráfico Pagado / Orgánico", tasks: ["Diseñar 3 creativos de anuncios orientados a conversión.", "Lanzar campaña de retargeting a usuarios que no completaron la compra."] },
            { title: "Sistema de Retención y Valor de Vida (LTV)", tasks: ["Implementar secuencia de email marketing post-compra.", "Crear incentivos para incentivar la recompra o recomendación."] }
          ];
        }

        let days = [];
        let dayCounter = 1;

        baseAtomicTasks.forEach((item) => {
          days.push({
            day: dayCounter++,
            title: item.title,
            tasks: item.tasks
          });
        });

        return days;
      };

      const handleNextStep = () => {
        if (currentStep < 4) {
          setCurrentStep(currentStep + 1);
        } else {
          const generatedPlan = generateCustomStrategy(formData);
          setPlanDays(generatedPlan);
          setOnboardingComplete(true);
        }
      };

      const handleResetProject = () => {
        if (confirm("¿Seguro que quieres reiniciar el proyecto? Se borrará el progreso guardado.")) {
          localStorage.removeItem('horizon_os_data');
          setOnboardingComplete(false);
          setCurrentStep(1);
          setPlanDays([]);
          setCurrentDayIndex(0);
          setUnlockedDayIndex(0);
          setCompletedTasks({});
          setGeneralMessages([]);
        }
      };

      const handleTaskToggle = (dayIdx, taskIdx) => {
        const key = `${dayIdx}-${taskIdx}`;
        setCompletedTasks(prev => ({
          ...prev,
          [key]: !prev[key]
        }));
      };

      const isDayTasksComplete = (dayIdx) => {
        const day = planDays[dayIdx];
        if (!day) return false;
        return day.tasks.every((_, tIdx) => completedTasks[`${dayIdx}-${tIdx}`]);
      };

      const handleCompleteDayAndAdvance = () => {
        if (currentDayIndex < planDays.length - 1) {
          const nextIdx = currentDayIndex + 1;
          setUnlockedDayIndex(Math.max(unlockedDayIndex, nextIdx));
          setCurrentDayIndex(nextIdx);
          setAiResponse('');
          setAiQuery('');
        }
      };

      const handleAskTaskCopilot = async (taskContext) => {
        if (!aiQuery.trim()) return;
        setAiLoading(true);
        setAiResponse('');

        const nicheName = formData.niche === 'otro' ? formData.customNiche : formData.niche;

        const prompt = `Contexto del cliente:
- Fase: ${formData.stage === 'crear' ? 'Crear proyecto nuevo' : 'Escalar negocio existente'}
- Nicho / Modelo: ${nicheName}
- Tiempo diario disponible: ${formData.timeCommitment}
- Marca/Proyecto: ${formData.brandName || 'Horizon Project'}
- Objetivo: ${formData.goalTarget || 'Crecer y facturar'}

Día/Tarea actual: "${taskContext}"
Pregunta concreta del usuario: "${aiQuery}"

Instrucción: Da una respuesta sumamente táctica, directa y ejecutable en 3-4 viñetas accionables adaptadas a sus ${formData.timeCommitment} diarios.`;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          setAiResponse(data.text || 'Sin respuesta.');
        } catch (err) {
          setAiResponse('Error al comunicarse con el copiloto.');
        } finally {
          setAiLoading(false);
        }
      };

      const handleSendGeneralMessage = async () => {
        if (!generalInput.trim()) return;
        const userMsg = generalInput;
        setGeneralMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setGeneralInput('');

        const nicheName = formData.niche === 'otro' ? formData.customNiche : formData.niche;

        const prompt = `Actúa como el Asistente Director Ejecutivo de Horizon OS para el usuario.
Contexto:
- Modelo de Negocio: ${nicheName}
- Fase: ${formData.stage}
- Disponibilidad: ${formData.timeCommitment} al día.
- Objetivo: ${formData.goalTarget}

Pregunta: ${userMsg}`;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });
          const data = await res.json();
          setGeneralMessages(prev => [...prev, { role: 'assistant', text: data.text }]);
        } catch (err) {
          setGeneralMessages(prev => [...prev, { role: 'assistant', text: 'Error de comunicación con la IA.' }]);
        }
      };

      const progressPercentage = planDays.length > 0 
        ? Math.round((unlockedDayIndex / planDays.length) * 100)
        : 0;

      return (
        <div class="flex-1 flex flex-col max-w-5xl w-full mx-auto p-4 md:p-8">
          {/* APPLE BAR HEADER */}
          <header class="flex items-center justify-between pb-6 mb-6 border-b border-white/10">
            <div class="flex items-center space-x-3.5">
              <div class="w-10 h-10 rounded-2xl apple-glass-panel flex items-center justify-center text-white font-medium text-xl shadow-2xl">
                
              </div>
              <div>
                <h1 class="text-lg font-semibold tracking-tight text-white/95">Horizon OS</h1>
                <p class="text-xs text-white/40 font-normal">Sistema Operativo Estratégico</p>
              </div>
            </div>

            {onboardingComplete && (
              <div class="flex items-center space-x-3">
                <button
                  onClick={handleResetProject}
                  class="text-xs font-medium text-white/40 hover:text-red-400 apple-transition px-3 py-1.5 rounded-full hover:bg-white/5"
                >
                  Reiniciar
                </button>

                <div class="flex items-center p-1 rounded-full apple-glass-panel text-xs">
                  <button
                    onClick={() => setActiveTab('roadmap')}
                    class={`px-4 py-1.5 rounded-full font-medium apple-transition ${
                      activeTab === 'roadmap'
                        ? 'bg-white/20 text-white shadow-sm border border-white/20'
                        : 'text-white/50 hover:text-white'
                    }`}
                  >
                    Hoja de Ruta
                  </button>
                  <button
                    onClick={() => setActiveTab('copilot')}
                    class={`px-4 py-1.5 rounded-full font-medium apple-transition ${
                      activeTab === 'copilot'
                        ? 'bg-white/20 text-white shadow-sm border border-white/20'
                        : 'text-white/50 hover:text-white'
                    }`}
                  >
                    Copiloto
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* BARRA DE PROGRESO LIQUID GLASS */}
          {onboardingComplete && activeTab === 'roadmap' && (
            <div class="mb-6 apple-glass-panel p-5 rounded-3xl">
              <div class="flex items-center justify-between text-xs font-medium mb-2.5">
                <span class="text-white/50 tracking-wider text-[11px] uppercase">Progreso General</span>
                <span class="text-blue-400 font-semibold">{unlockedDayIndex} de {planDays.length} Días ({progressPercentage}%)</span>
              </div>
              <div class="w-full h-2 bg-black/50 rounded-full overflow-hidden p-0.5 border border-white/10">
                <div 
                  class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full apple-transition shadow-lg shadow-blue-500/50"
                  style={{ width: `${progressPercentage}%` }}
                ></div>
              </div>
            </div>
          )}

          {/* ONBOARDING CUESTIONARIO APPLE LIQUID GLASS */}
          {!onboardingComplete && (
            <main class="flex-1 flex items-center justify-center py-6">
              <div class="apple-glass-panel p-8 md:p-10 rounded-[32px] max-w-md w-full relative overflow-hidden">
                {/* Indicador de pasos estilo iOS */}
                <div class="flex items-center justify-between mb-8 px-1">
                  {[1, 2, 3, 4].map(stepNum => (
                    <div key={stepNum} class="flex items-center">
                      <div class={`w-8 h-8 rounded-full flex items-center justify-center font-medium text-xs apple-transition ${
                        currentStep === stepNum
                          ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/40 ring-2 ring-white/20'
                          : currentStep > stepNum
                          ? 'bg-white/20 text-white'
                          : 'bg-white/5 text-white/30'
                      }`}>
                        {stepNum}
                      </div>
                      {stepNum < 4 && (
                        <div class={`w-8 h-0.5 mx-1.5 rounded-full ${currentStep > stepNum ? 'bg-blue-500/60' : 'bg-white/10'}`}></div>
                      )}
                    </div>
                  ))}
                </div>

                {/* PASO 1 */}
                {currentStep === 1 && (
                  <div class="space-y-6">
                    <div>
                      <h2 class="text-2xl font-semibold text-white tracking-tight">¿En qué punto te encuentras?</h2>
                      <p class="text-xs text-white/50 mt-1">Selecciona el estado de tu iniciativa.</p>
                    </div>
                    
                    <div class="space-y-3">
                      {[
                        { id: 'crear', title: '🚀 Crear un Proyecto Nuevo', desc: 'Empezar desde cero: concepto, MVP o catálogo.' },
                        { id: 'escalar', title: '📈 Escalar Negocio Existente', desc: 'Optimizar embudos, facturación y tráfico.' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setFormData({ ...formData, stage: item.id })}
                          class={`w-full p-4 rounded-2xl text-left apple-transition border ${
                            formData.stage === item.id
                              ? 'bg-blue-500/20 border-blue-500/60 text-white shadow-lg shadow-blue-500/10'
                              : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'
                          }`}
                        >
                          <div class="font-medium text-sm text-white">{item.title}</div>
                          <div class="text-xs text-white/40 mt-1">{item.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* PASO 2 */}
                {currentStep === 2 && (
                  <div class="space-y-6">
                    <div>
                      <h2 class="text-2xl font-semibold text-white tracking-tight">¿Cuál es tu modelo?</h2>
                      <p class="text-xs text-white/50 mt-1">Selecciona la categoría principal.</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                      {[
                        { id: 'ropa', label: '👕 Moda & Ropa', desc: 'Tech packs y drops' },
                        { id: 'app', label: '📱 App / SaaS', desc: 'Wireframes y MVP' },
                        { id: 'servicios', label: '🤝 Servicios', desc: 'High ticket' },
                        { id: 'ecommerce', label: '🛍️ E-commerce', desc: 'Conversión' },
                        { id: 'otro', label: '✨ Personalizado', desc: 'Tu modelo' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setFormData({ ...formData, niche: item.id })}
                          class={`p-3.5 rounded-2xl text-left apple-transition border ${
                            formData.niche === item.id
                              ? 'bg-blue-500/20 border-blue-500/60 text-white shadow-lg shadow-blue-500/10'
                              : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'
                          }`}
                        >
                          <div class="font-medium text-xs text-white">{item.label}</div>
                          <div class="text-[10px] text-white/40 mt-0.5">{item.desc}</div>
                        </button>
                      ))}
                    </div>

                    {formData.niche === 'otro' && (
                      <div class="pt-2">
                        <input
                          type="text"
                          placeholder="Escribe tu modelo exacto..."
                          value={formData.customNiche}
                          onChange={(e) => setFormData({ ...formData, customNiche: e.target.value })}
                          class="w-full apple-glass-input rounded-2xl px-4 py-3 text-xs text-white placeholder-white/30 focus:outline-none"
                        />
                      </div>
                    )}
                  </div>
                )}

                {/* PASO 3 */}
                {currentStep === 3 && (
                  <div class="space-y-6">
                    <div>
                      <h2 class="text-2xl font-semibold text-white tracking-tight">Tiempo diario disponible</h2>
                      <p class="text-xs text-white/50 mt-1">Ajustaremos la carga de ejecución diaria.</p>
                    </div>

                    <div class="space-y-3">
                      {[
                        { id: '2h', title: '⏱️ 1 a 2 Horas / día', desc: 'Ejecución atómica enfocada.' },
                        { id: '4h', title: '⚡ 3 a 4 Horas / día', desc: 'Ritmo acelerado.' },
                        { id: '8h', title: '🔥 Tiempo Completo (5-8h / día)', desc: 'Máxima intensidad.' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setFormData({ ...formData, timeCommitment: item.id })}
                          class={`w-full p-4 rounded-2xl text-left apple-transition border ${
                            formData.timeCommitment === item.id
                              ? 'bg-blue-500/20 border-blue-500/60 text-white shadow-lg shadow-blue-500/10'
                              : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'
                          }`}
                        >
                          <div class="font-medium text-xs text-white">{item.title}</div>
                          <div class="text-[11px] text-white/40 mt-0.5">{item.desc}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* PASO 4 */}
                {currentStep === 4 && (
                  <div class="space-y-6">
                    <div>
                      <h2 class="text-2xl font-semibold text-white tracking-tight">Detalles del Proyecto</h2>
                      <p class="text-xs text-white/50 mt-1">Define el nombre y la meta principal.</p>
                    </div>

                    <div class="space-y-4">
                      <div>
                        <label class="block text-[10px] font-semibold text-white/50 mb-1.5 uppercase tracking-wider">Nombre del Proyecto</label>
                        <input
                          type="text"
                          placeholder="Ej. Timeless, Horizon..."
                          value={formData.brandName}
                          onChange={(e) => setFormData({ ...formData, brandName: e.target.value })}
                          class="w-full apple-glass-input rounded-2xl px-4 py-3 text-xs text-white placeholder-white/30 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label class="block text-[10px] font-semibold text-white/50 mb-1.5 uppercase tracking-wider">Meta Principal</label>
                        <input
                          type="text"
                          placeholder="Ej. Facturar 10.000€/mes"
                          value={formData.goalTarget}
                          onChange={(e) => setFormData({ ...formData, goalTarget: e.target.value })}
                          class="w-full apple-glass-input rounded-2xl px-4 py-3 text-xs text-white placeholder-white/30 focus:outline-none"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {/* Botones de Navegación */}
                <div class="mt-8 pt-5 border-t border-white/10 flex justify-between items-center">
                  {currentStep > 1 ? (
                    <button
                      onClick={() => setCurrentStep(currentStep - 1)}
                      class="text-xs font-medium text-white/40 hover:text-white apple-transition px-3 py-2 rounded-xl"
                    >
                      Atrás
                    </button>
                  ) : <div></div>}

                  <button
                    onClick={handleNextStep}
                    class="apple-btn-primary text-white font-medium px-6 py-2.5 rounded-full text-xs"
                  >
                    {currentStep === 4 ? 'Generar Estrategia' : 'Continuar →'}
                  </button>
                </div>
              </div>
            </main>
          )}

          {/* DASHBOARD PRINCIPAL */}
          {onboardingComplete && activeTab === 'roadmap' && (
            <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* Panel Izquierdo: Días */}
              <div class="lg:col-span-4 space-y-3">
                <div class="apple-glass-panel p-4 rounded-3xl mb-4 flex items-center justify-between">
                  <div>
                    <div class="text-[10px] text-blue-400 font-semibold uppercase tracking-wider">Estrategia Activa</div>
                    <div class="text-sm font-semibold text-white tracking-tight">{formData.brandName || 'Horizon Project'}</div>
                  </div>

                  <div class="flex items-center p-0.5 rounded-full apple-glass-card">
                    <button
                      onClick={() => setViewMode('list')}
                      class={`px-3 py-1 rounded-full text-[11px] font-medium apple-transition ${viewMode === 'list' ? 'bg-white/20 text-white' : 'text-white/40'}`}
                    >
                      Lista
                    </button>
                    <button
                      onClick={() => setViewMode('grid')}
                      class={`px-3 py-1 rounded-full text-[11px] font-medium apple-transition ${viewMode === 'grid' ? 'bg-white/20 text-white' : 'text-white/40'}`}
                    >
                      Grid
                    </button>
                  </div>
                </div>

                {/* LISTA */}
                {viewMode === 'list' && (
                  <div class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                    {planDays.map((dayData, idx) => {
                      const isLocked = idx > unlockedDayIndex;
                      const isCurrent = idx === currentDayIndex;

                      return (
                        <button
                          key={dayData.day}
                          disabled={isLocked}
                          onClick={() => {
                            if (!isLocked) {
                              setCurrentDayIndex(idx);
                              setAiResponse('');
                              setAiQuery('');
                            }
                          }}
                          class={`w-full p-3.5 rounded-2xl border text-left apple-transition flex items-center justify-between ${
                            isCurrent
                              ? 'bg-blue-500/20 border-blue-500/50 text-white shadow-lg shadow-blue-500/10'
                              : isLocked
                              ? 'bg-white/2 border-white/5 text-white/20 cursor-not-allowed'
                              : 'bg-white/5 border-white/10 text-white/80 hover:bg-white/10'
                          }`}
                        >
                          <div>
                            <div class="text-[10px] text-blue-400 font-semibold uppercase tracking-wider mb-0.5 flex items-center space-x-1">
                              <span>Día {dayData.day}</span>
                              {isLocked && <span class="text-xs">🔒</span>}
                            </div>
                            <div class="font-medium text-xs text-white/90">{dayData.title}</div>
                          </div>
                          <div class="text-[10px] text-white/40">{dayData.tasks.length} tareas</div>
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* GRID */}
                {viewMode === 'grid' && (
                  <div class="grid grid-cols-3 gap-2 max-h-[500px] overflow-y-auto pr-1">
                    {planDays.map((dayData, idx) => {
                      const isLocked = idx > unlockedDayIndex;
                      const isCurrent = idx === currentDayIndex;

                      return (
                        <button
                          key={dayData.day}
                          disabled={isLocked}
                          onClick={() => {
                            if (!isLocked) {
                              setCurrentDayIndex(idx);
                              setAiResponse('');
                              setAiQuery('');
                            }
                          }}
                          class={`p-3 rounded-2xl border text-center apple-transition flex flex-col items-center justify-center space-y-1 ${
                            isCurrent
                              ? 'bg-blue-500/20 border-blue-500/50 text-white font-semibold'
                              : isLocked
                              ? 'bg-white/2 border-white/5 text-white/20 cursor-not-allowed'
                              : 'bg-white/5 border-white/10 text-white/80 hover:bg-white/10'
                          }`}
                        >
                          <span class="text-[10px] font-semibold text-blue-400">Día {dayData.day}</span>
                          {isLocked ? (
                            <span class="text-xs">🔒</span>
                          ) : (
                            <span class="text-[10px] line-clamp-1 text-white/70">{dayData.title}</span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Panel Central: Tareas */}
              <div class="lg:col-span-8">
                {planDays[currentDayIndex] && (
                  <div class="apple-glass-panel p-6 md:p-8 rounded-[32px] space-y-6">
                    <div class="flex items-center justify-between pb-5 border-b border-white/10">
                      <div>
                        <span class="text-[10px] font-semibold uppercase text-blue-400 tracking-wider">
                          Paso Diario #{planDays[currentDayIndex].day}
                        </span>
                        <h2 class="text-xl font-semibold text-white tracking-tight mt-0.5">
                          {planDays[currentDayIndex].title}
                        </h2>
                      </div>

                      {currentDayIndex < planDays.length - 1 && (
                        <button
                          onClick={handleCompleteDayAndAdvance}
                          disabled={!isDayTasksComplete(currentDayIndex)}
                          class={`px-4 py-2 rounded-full text-xs font-medium apple-transition ${
                            isDayTasksComplete(currentDayIndex)
                              ? 'apple-btn-primary text-white'
                              : 'bg-white/5 text-white/30 border border-white/10 cursor-not-allowed'
                          }`}
                        >
                          {isDayTasksComplete(currentDayIndex) ? 'Siguiente Día →' : '🔒 Completa tareas'}
                        </button>
                      )}
                    </div>

                    {/* Lista Tareas */}
                    <div class="space-y-3">
                      {planDays[currentDayIndex].tasks.map((taskDesc, taskIdx) => {
                        const isChecked = !!completedTasks[`${currentDayIndex}-${taskIdx}`];

                        return (
                          <div 
                            key={taskIdx} 
                            onClick={() => handleTaskToggle(currentDayIndex, taskIdx)}
                            class={`border p-4 rounded-2xl cursor-pointer apple-transition ${
                              isChecked
                                ? 'bg-blue-500/10 border-blue-500/30'
                                : 'bg-white/5 border-white/10 hover:bg-white/10'
                            }`}
                          >
                            <div class="flex items-start space-x-3.5">
                              <div class={`w-5 h-5 rounded-full mt-0.5 flex items-center justify-center border apple-transition ${
                                isChecked ? 'bg-blue-500 border-blue-500 text-white' : 'border-white/30 bg-white/5'
                              }`}>
                                {isChecked && <span class="text-[10px]">✓</span>}
                              </div>
                              <div class="flex-1">
                                <h3 class={`font-normal text-xs leading-relaxed ${isChecked ? 'text-white/40 line-through' : 'text-white/90'}`}>
                                  {taskDesc}
                                </h3>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Copiloto Integrado */}
                    <div class="pt-5 border-t border-white/10 space-y-3">
                      <div class="text-[10px] font-semibold uppercase text-blue-400 tracking-wider">
                        🤖 Copiloto Táctico
                      </div>
                      
                      <div class="flex items-center space-x-2">
                        <input
                          type="text"
                          placeholder="Pregunta sobre esta tarea concreta..."
                          value={aiQuery}
                          onChange={(e) => setAiQuery(e.target.value)}
                          class="flex-1 apple-glass-input rounded-2xl px-4 py-2.5 text-xs text-white placeholder-white/30 focus:outline-none"
                        />
                        <button
                          onClick={() => handleAskTaskCopilot(planDays[currentDayIndex].title)}
                          disabled={aiLoading}
                          class="apple-btn-primary text-white font-medium px-4 py-2.5 rounded-2xl text-xs apple-transition disabled:opacity-50"
                        >
                          {aiLoading ? '...' : 'Consultar'}
                        </button>
                      </div>

                      {aiResponse && (
                        <div class="p-4 bg-white/5 border border-white/10 rounded-2xl text-xs text-white/80 leading-relaxed whitespace-pre-line">
                          {aiResponse}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* PESTAÑA COPILOTO */}
          {onboardingComplete && activeTab === 'copilot' && (
            <main class="flex-1 flex flex-col apple-glass-panel rounded-[32px] overflow-hidden h-[580px]">
              <div class="p-4 bg-white/5 border-b border-white/10">
                <h3 class="font-semibold text-white text-xs">Copiloto Estratégico Ejecutivo</h3>
                <p class="text-[11px] text-white/40">Asesor de dirección para {formData.brandName || 'tu proyecto'}.</p>
              </div>

              <div class="flex-1 p-5 overflow-y-auto space-y-3">
                {generalMessages.length === 0 && (
                  <div class="text-center text-white/30 text-xs my-16">
                    Escribe tu primera consulta de estrategia general.
                  </div>
                )}
                {generalMessages.map((msg, i) => (
                  <div key={i} class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div class={`max-w-md p-4 rounded-2xl text-xs leading-relaxed whitespace-pre-line apple-transition ${
                      msg.role === 'user'
                        ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/20'
                        : 'bg-white/10 border border-white/10 text-white/90'
                    }`}>
                      {msg.text}
                    </div>
                  </div>
                ))}
              </div>

              <div class="p-3.5 bg-black/40 border-t border-white/10 flex items-center space-x-2">
                <input
                  type="text"
                  placeholder="Pregunta sobre estrategia..."
                  value={generalInput}
                  onChange={(e) => setGeneralInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSendGeneralMessage()}
                  class="flex-1 apple-glass-input rounded-2xl px-4 py-2.5 text-xs text-white placeholder-white/30 focus:outline-none"
                />
                <button
                  onClick={handleSendGeneralMessage}
                  class="apple-btn-primary text-white font-medium px-5 py-2.5 rounded-2xl text-xs apple-transition"
                >
                  Enviar
                </button>
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
