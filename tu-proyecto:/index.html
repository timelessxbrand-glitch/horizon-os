<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon OS</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141419;
      --accent: #6366f1;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    
    header { padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(10px); }
    header h1 { font-size: 1.25rem; tracking: 0.1em; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }

    #chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; margin: 0 auto; }
    .message { padding: 1rem 1.25rem; border-radius: 12px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; }
    .user { background-color: var(--accent); color: #fff; align-self: flex-end; }
    .assistant { background-color: var(--card-bg); border: 1px solid var(--border); align-self: flex-start; }

    #input-form { padding: 1.5rem; border-top: 1px solid var(--border); background: var(--bg-color); }
    .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 0.75rem; }
    input[type="text"] { flex: 1; padding: 0.85rem 1rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    button { padding: 0.85rem 1.5rem; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>Horizon OS</h1>
  </header>

  <main id="chat-container">
    <div class="message assistant">Hola, Gonzalo. Sistema Horizon OS listo. ¿En qué trabajamos hoy?</div>
  </main>

  <form id="input-form">
    <div class="input-wrapper">
      <input type="text" id="user-input" placeholder="Escribe tu consulta..." autocomplete="off" required />
      <button type="submit">Enviar</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('input-form');
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.classList.add('message', role);
      msg.textContent = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      input.value = '';

      const loadingMsg = appendMessage('Pensando...', 'assistant');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        
        if (data.text) {
          loadingMsg.textContent = data.text;
        } else if (data.error) {
          loadingMsg.textContent = 'Error: ' + data.error;
        } else {
          loadingMsg.textContent = 'Sin respuesta del servidor.';
        }
      } catch (err) {
        loadingMsg.textContent = 'Error al conectar con Horizon OS.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
